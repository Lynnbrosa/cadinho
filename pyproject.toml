[project]
name = "cadinho"
version = "0.1.0"
description = "SGCA / sarcoglycanopathy missense variant pathogenicity classifier (research/learning, NON-clinical)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cadinho" }]

# Pinned-by-lockfile dependencies. Lower bounds here; exact pins live in uv.lock.
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "lightgbm>=4.3,<5",
    "shap>=0.46,<1",  # >=0.46 required for NumPy 2.x (0.45 uses removed np.obj2sctype)
    "pydantic>=2.6,<3",
    "pyyaml>=6,<7",
    "requests>=2.31,<3",
    "click>=8.1,<9",
    "matplotlib>=3.8,<4",
    "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.4,<1",
]

[project.scripts]
cadinho = "cadinho.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadinho"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
